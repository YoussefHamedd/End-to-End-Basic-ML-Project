global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'ml-application'
    static_configs:
      - targets: ['ml-app:8080']
    metrics_path: '/metrics'

  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
